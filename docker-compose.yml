version: "3.9"

services:
  backend:
    build: ./backend
    container_name: summarix-backend
    ports:
      - "8000:8000"
    environment:
      - FRONTEND_ORIGIN=http://localhost:5173
      - TRANSFORMERS_CACHE=/app/.cache/huggingface
    volumes:
      - hf_cache:/app/.cache/huggingface
    restart: unless-stopped
    networks:
      - summarix-net

  frontend:
    build: ./frontend
    container_name: summarix-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - summarix-net

networks:
  summarix-net:
    driver: bridge

volumes:
  hf_cache:
